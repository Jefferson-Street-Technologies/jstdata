id: tutorial
title: Welcome to Jefferson Street
workspace:
  id: 0
  label: Scratch
  description: >-
    An empty workspace to stage metrics, entities, and series as you explore.
    Hand-edit this investigation YAML or use step UIs; V0 keeps structural
    action changes in the file / Python API.
actions:
- id: 0
  type: home
  description: >-
    Jefferson Street is an IDE for financial research in the terminal.
    You and an agent share an investigation — a tree of analytical actions
    over a staged workspace and saved queries. Use : for commands
    (workspace, search, add, rm). n/p (or ↑/↓) move among sibling actions;
    N/P (or →/←) go into a child or back to the parent. Open :workspace
    to inspect the bag. Edit this YAML (or ~/.jstdata/.active.yaml) and
    the TUI will pick up the change.
  args: {}
