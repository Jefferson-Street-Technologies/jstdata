actions:
- id: 0
  type: home
  description: >-
    Plain Bagel demo — hyperscaler debt.

    Workspace holds four CIKs (Alphabet, Microsoft, Meta, Amazon) and debt /
    cash / capex metrics. Query 1 is the cartesian latest-value pull.

    Demo loop:
      1. Open the Table child (N or :add already done) — coverage via /preview,
         no values yet.
      2. Press r to load latest values (/query).
      3. Enter on a cell → drill Entity, Metric, or Release.
      4. On Release, press r to see filing label / date / source.
      5. On Metric, press r for description, variants, and taxonomies.

    Tree: n/p siblings · N into child · P up to parent · : for commands.
    CLI: jst query show 1 · jst query inspect 1 · jst query run 1
  args: {}
