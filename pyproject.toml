[tool.poetry]
name = "jstdata"
version = "0.2.0"
description = "Python API, CLI, and investigation TUI for Jefferson Street financial and economic data."
authors = ["Mahfuj Ahbab"]
readme = "README.md"
license = "MIT"
include = [
    "jstdata/investigation/bundled/*.yaml",
    "jstdata/agent/skills/jst/SKILL.md",
]
homepage = "https://github.com/Jefferson-Street-Technologies/jstdata"
repository = "https://github.com/Jefferson-Street-Technologies/jstdata"
keywords = ["api", "cli", "data", "jefferson street", "economics", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.2.1"
pandas = "^2.3.1"
tabulate = "^0.9.0"
textual = "^1.0.0"
pyperclip = "^1.9.0"
pyyaml = "^6.0.3"
requests = "^2.31.0"
# Pin past emSign root CA compromise in certifi's CA bundle (CVE via requests).
certifi = ">=2026.10.19"
# Pin past urllib3 streaming / chunked-response DoS issues (via requests).
urllib3 = ">=2.8.0"
# Pin past incomplete idna DoS fix (via requests).
idna = ">=3.15"
textual-plotext = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
requests-mock = "^1.12.1"
pytest-cov = "^6.1.1"
black = "^26.10.1"
# Pin past pygments AdlLexer ReDoS (transitive via pytest/black tooling).
pygments = ">=2.20.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
mypy = "^1.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
jst = "jstdata.cli:cli"
